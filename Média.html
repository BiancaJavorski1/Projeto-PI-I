<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Média Acadêmica</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #1e293b;
            --border: #e2e8f0;
            --success: #16a34a;
            --danger: #dc2626;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 450px;
        }

        h2 {
            margin-top: 0;
            color: var(--text);
            text-align: center;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            margin-top: 20px;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            display: none;
            font-weight: bold;
        }

        .approved {
            background-color: #dcfce7;
            color: var(--success);
            border: 1px solid #bbf7d0;
        }

        .reproved {
            background-color: #fee2e2;
            color: var(--danger);
            border: 1px solid #fecaca;
        }

        .error {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cálculo de Média Acadêmica</h2>
    
    <div class="input-group">
        <label for="nota1">Nota 1 (Peso 1):</label>
        <input type="number" id="nota1" min="0" max="10" step="0.1" placeholder="Ex: 7.5">
    </div>

    <div class="input-group">
        <label for="nota2">Nota 2 (Peso 1):</label>
        <input type="number" id="nota2" min="0" max="10" step="0.1" placeholder="Ex: 8.0">
    </div>

    <div class="input-group">
        <label for="nota3">Nota 3 (Peso 1):</label>
        <input type="number" id="nota3" min="0" max="10" step="0.1" placeholder="Ex: 6.0">
    </div>

    <p id="error-msg" class="error">Por favor, preencha todas as notas com valores válidos entre 0 e 10.</p>

    <button onclick="calcularMedia()">Calcular Média</button>

    <div id="result" class="result-box"></div>
</div>

<script>
    /**
     * Função responsável por validar as entradas e calcular a média aritmética simples.
     * Algoritmo:
     * 1. Captura dos valores inseridos nos input.
     * 2. Validação para garantir que são números dentro da escala 0-10.
     * 3. Processamento: Soma das notas dividida pelo total de avaliações (3).
     * 4. Decisão: Compara com a média de corte (7.0 padrão mec) para definir a situação acadêmica.
     */
    function calcularMedia() {
        const n1 = parseFloat(document.getElementById('nota1').value);
        const n2 = parseFloat(document.getElementById('nota2').value);
        const n3 = parseFloat(document.getElementById('nota3').value);
        
        const errorMsg = document.getElementById('error-msg');
        const resultDiv = document.getElementById('result');

        // Validação de entrada
        if (isNaN(n1) || isNaN(n2) || isNaN(n3) || 
            n1 < 0 || n1 > 10 || n2 < 0 || n2 > 10 || n3 < 0 || n3 > 10) {
            errorMsg.style.display = 'block';
            resultDiv.style.display = 'none';
            return;
        }

        errorMsg.style.display = 'none';

        // Processamento/ analise de notas (Algoritmo de Média Aritmética)
        const media = (n1 + n2 + n3) / 3;
        const mediaFormatada = media.toFixed(2);

        // Saída e Regra de Negócio (Média mínima: 7.0)
        resultDiv.style.display = 'block';
        if (media >= 7.0) {
            resultDiv.className = 'result-box approved';
            resultDiv.innerHTML = `Média: ${mediaFormatada} <br> Status: APROVADO`;
        } else {
            resultDiv.className = 'result-box reproved';
            resultDiv.innerHTML = `Média: ${mediaFormatada} <br> Status: REPROVADO`;
        }
    }
</script>

</body>
</html>
